<body>

<!-- Sidebar -->

</div>

<div id="menuBtn">☰</div>

<div id="overlay"></div>

<div class="container">

<h1>Video mới nhất</h1>

<div id="videoList"></div>

</div>

<script>

const API_KEY="DÁN_API_KEY";
const CHANNEL_ID="UCLnX7s80sPp3JdArqyhh3DQ";

async function loadVideos(){

const search=await fetch(`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet&order=date&maxResults=12&type=video`);

const data=await search.json();

let html="";

data.items.forEach(video=>{

html+=`

<a class="videoCard"

href="https://youtube.com/watch?v=${video.id.videoId}"

target="_blank">

<img src="${video.snippet.thumbnails.high.url}">

<h3>${video.snippet.title}</h3>

<p>${new Date(video.snippet.publishedAt).toLocaleDateString()}</p>

</a>

`;

});

document.getElementById("videoList").innerHTML=html;

}

loadVideos();

</script>

<script src="script.js"></script>

</body>
</html>
